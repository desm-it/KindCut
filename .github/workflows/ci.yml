name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ runner.temp }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - name: Check out KindCut
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Joy runtime Python environment
        run: npm run setup --workspace @cricut-companion/joy-runtime

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
