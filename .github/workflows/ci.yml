name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'codex/**'
      - 'refactor/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - name: Configure runner scratch directory
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out KindCut
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Joy runtime Python environment
        run: npm run setup --workspace @cricut-companion/joy-runtime

      - name: Provide POSIX-style interpreter alias for native integration fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/joy-runtime/.venv/bin | Out-Null
          $python = Resolve-Path packages/joy-runtime/.venv/Scripts/python.exe
          New-Item -ItemType SymbolicLink -Force -Path packages/joy-runtime/.venv/bin/python -Target $python | Out-Null
          New-Item -ItemType SymbolicLink -Force -Path packages/joy-runtime/.venv/bin/python.exe -Target $python | Out-Null

      - name: Formatting and test-policy checks
        run: npm run test:format && npm run test:policy

      - name: Typecheck
        run: npm run typecheck

      - name: Test all supported platform contracts
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify compiled host and inert frozen SDK
        if: runner.os == 'macOS'
        run: npm run test:compiled-host && npm run test:runtime-inert
