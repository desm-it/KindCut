name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"

jobs:
  check:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out KindCut
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
