name: Release Builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach builds to; leave blank for smoke artifacts only
        required: false
        default: ""
      slicebug_ref:
        description: SliceBug git ref to bundle
        required: false
        default: main
  release:
    types:
      - published
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SLICEBUG_REPOSITORY: ${{ vars.SLICEBUG_REPOSITORY || 'desm-it/slicebug' }}
  SLICEBUG_REF: ${{ inputs.slicebug_ref || vars.SLICEBUG_REF || 'main' }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

jobs:
  mac:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - name: Check out KindCut
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Check out SliceBug
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SLICEBUG_REPOSITORY }}
          ref: ${{ env.SLICEBUG_REF }}
          path: vendor/slicebug
          token: ${{ secrets.SLICEBUG_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Check
        run: npm run typecheck && npm run test

      - name: Build mac release
        run: npm run package:desktop:mac

      - name: Upload mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindcut-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*-mac.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out KindCut
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Check out SliceBug
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SLICEBUG_REPOSITORY }}
          ref: ${{ env.SLICEBUG_REF }}
          path: vendor/slicebug
          token: ${{ secrets.SLICEBUG_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci failed on attempt ${attempt}; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Check
        run: npm run typecheck && npm run test

      - name: Build Windows release
        env:
          PYTHON: python
        run: npm run package:desktop:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindcut-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml

  github-release:
    name: Attach Release Artifacts
    needs:
      - mac
      - windows
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: ${{ github.event_name != 'release' && inputs.release_tag == '' }}
          files: release-artifacts/**/*
